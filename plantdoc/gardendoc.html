<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GardenDoc — photo feedback</title>
<style>
  :root {
    --green-dark: #1e4d2b;
    --green: #2e7d43;
    --green-light: #e8f3ec;
    --amber: #b7791f;
    --red: #b3372f;
    --ink: #22301f;
    --muted: #6b7a66;
    --bg: #f3f6f1;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--green-dark); color: #fff;
    padding: 16px 22px; display: flex; align-items: center; gap: 12px;
  }
  header svg { width: 30px; height: 30px; flex: none; }
  header h1 { font-size: 1.2rem; margin: 0; font-weight: 650; }
  header .sub { font-size: .74rem; opacity: .75; display: block; margin-top: 2px; }
  .lang-toggle { margin-left: auto; display: flex; gap: 4px; flex: none; }
  .lang-toggle button {
    border: 1.5px solid rgba(255,255,255,.4); background: transparent; color: #fff;
    border-radius: 8px; padding: 5px 10px; font-size: .78rem; font-weight: 650; cursor: pointer;
  }
  .lang-toggle button.active { background: #fff; color: var(--green-dark); border-color: #fff; }
  main { max-width: 880px; margin: 0 auto; padding: 18px 16px 60px; }

  .card {
    background: #fff; border-radius: var(--radius);
    box-shadow: 0 1px 4px rgba(20,40,20,.08);
    padding: 16px; margin-bottom: 16px;
  }

  /* API key */
  #key-row { display: flex; gap: 8px; align-items: center; }
  #key-row input {
    flex: 1; border: 1.5px solid #d5e0d5; border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: .9rem;
  }
  #key-row input:focus { outline: 2px solid var(--green); border-color: transparent; }
  #key-status { font-size: .82rem; color: var(--muted); margin-top: 8px; }
  #key-status.ok { color: var(--green); font-weight: 600; }
  .btn-small {
    border: 1.5px solid #cfdccf; background: #fff; color: var(--ink);
    border-radius: 10px; padding: 10px 16px; font-size: .88rem; cursor: pointer;
  }
  .btn-small:hover { background: var(--green-light); }

  /* Options */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid #cfdccf; background: #fff; color: var(--ink);
    border-radius: 999px; padding: 7px 15px; font-size: .88rem; cursor: pointer;
  }
  .chip.active { background: var(--green); border-color: var(--green); color: #fff; }

  /* Drop zone */
  #drop-zone {
    border: 2px dashed #b9ccb9; border-radius: var(--radius);
    padding: 34px 16px; text-align: center; color: var(--muted);
    cursor: pointer; transition: background .15s, border-color .15s;
    margin-top: 14px;
  }
  #drop-zone.drag { background: var(--green-light); border-color: var(--green); }
  #drop-zone svg { width: 44px; height: 44px; margin-bottom: 8px; color: var(--green); }
  #drop-zone p { margin: 3px 0; font-size: .92rem; }

  .toolbar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 12px; padding: 13px 22px;
    font-size: .95rem; font-weight: 650; cursor: pointer;
    background: var(--green); color: #fff;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid #cfdccf; font-weight: 500; }

  /* Photo cards */
  .photo-card { display: grid; grid-template-columns: 240px 1fr; gap: 16px; }
  @media (max-width: 640px) { .photo-card { grid-template-columns: 1fr; } }
  .photo-left img { width: 100%; border-radius: 10px; display: block; }
  .photo-left textarea {
    width: 100%; border: 1.5px solid #d5e0d5; border-radius: 10px;
    padding: 8px 10px; font: inherit; font-size: .82rem; resize: vertical;
    min-height: 44px; margin-top: 8px;
  }
  .photo-left .row { display: flex; gap: 8px; margin-top: 8px; }
  .photo-left .row .btn { flex: 1; padding: 10px; font-size: .88rem; }
  .photo-left .remove {
    border: 0; background: none; color: var(--muted); font-size: .8rem;
    cursor: pointer; text-decoration: underline; padding: 8px 4px;
  }

  .status { font-size: .88rem; color: var(--muted); display: flex; align-items: center; gap: 9px; }
  .spinner {
    width: 18px; height: 18px; border: 3px solid #d8e5d8; border-top-color: var(--green);
    border-radius: 50%; animation: spin .9s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: var(--red); font-size: .88rem; background: #fdecea; border-radius: 8px; padding: 10px 12px; }

  /* Diagnosis rendering */
  .verdict { display: flex; align-items: center; gap: 12px; }
  .health-badge {
    flex: none; width: 50px; height: 50px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem; background: var(--green-light);
  }
  .verdict h2 { margin: 0 0 2px; font-size: 1.02rem; }
  .verdict .sci { font-style: italic; color: var(--muted); font-size: .8rem; }
  .status-line { font-size: .84rem; margin-top: 2px; font-weight: 600; }
  .status-healthy { color: var(--green); }
  .status-minor_issues { color: #7a8a1f; }
  .status-moderate_issues { color: var(--amber); }
  .status-severe_issues, .status-dying_or_dead { color: var(--red); }
  .summary { margin: 10px 0 0; font-size: .92rem; line-height: 1.5; }
  .water-flag {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 5px 12px; border-radius: 999px; font-size: .8rem; font-weight: 600;
    background: var(--green-light);
  }
  .water-flag.bad { background: #fdecea; color: var(--red); }
  h3.section {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 16px 0 8px;
  }
  .issue {
    border-left: 4px solid var(--amber); background: #fbf7ef;
    border-radius: 8px; padding: 9px 12px; margin-bottom: 7px;
  }
  .issue.high { border-color: var(--red); background: #fdf0ef; }
  .issue.low { border-color: #8aa86f; background: #f2f7ee; }
  .issue b { font-size: .9rem; }
  .issue .tag {
    font-size: .66rem; text-transform: uppercase; font-weight: 700;
    letter-spacing: .04em; padding: 2px 7px; border-radius: 5px;
    background: rgba(0,0,0,.07); margin-left: 6px;
  }
  .issue p { margin: 4px 0 0; font-size: .83rem; color: #4c5947; line-height: 1.45; }
  ol.actions, ul.plain { margin: 0; padding-left: 20px; }
  ol.actions li, ul.plain li { font-size: .88rem; line-height: 1.5; margin-bottom: 7px; }
  .note {
    font-size: .8rem; color: var(--muted); background: var(--green-light);
    border-radius: 8px; padding: 8px 12px; margin-top: 12px;
  }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22c5-2 8-6.5 8-12V5l-8-3-8 3v5c0 5.5 3 10 8 12z" opacity=".35"/>
    <path d="M12 16c0-4 2-6 5-7-1 4-2 6.2-5 7zM12 16c0-3-1.5-4.5-4-5.4.8 3.2 1.7 4.8 4 5.4zM12 16v4"/>
  </svg>
  <h1>GardenDoc
    <span class="sub" data-i18n="sub">Add photos of plants, lawn or trees — get feedback on what to fix</span>
  </h1>
  <div class="lang-toggle">
    <button data-lang="en">EN</button>
    <button data-lang="ro">RO</button>
  </div>
</header>

<main>
  <div class="card" id="key-card">
    <h3 class="section" style="margin-top:0" data-i18n="keyTitle">Anthropic API key</h3>
    <div id="key-row">
      <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off">
      <button class="btn-small" id="save-key" data-i18n="save">Save</button>
    </div>
    <div id="key-status"></div>
  </div>

  <div class="card">
    <div class="chips" id="chips">
      <button class="chip active" data-cat="auto" data-i18n="catAuto">🔍 Auto-detect</button>
      <button class="chip" data-cat="plant" data-i18n="catPlant">🪴 Plant</button>
      <button class="chip" data-cat="lawn" data-i18n="catLawn">🌱 Lawn</button>
      <button class="chip" data-cat="tree" data-i18n="catTree">🌳 Tree</button>
    </div>

    <div id="drop-zone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <p data-i18n-html="dropMain"><b>Click to add photos</b> or drag &amp; drop them here</p>
      <p data-i18n="dropSub">You can add several at once</p>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple hidden>

    <div class="toolbar">
      <button class="btn" id="analyze-all" disabled data-i18n="diagnoseAll">Diagnose all photos</button>
      <button class="btn ghost" id="clear-all" style="display:none" data-i18n="clear">Clear</button>
    </div>
  </div>

  <div id="photos"></div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const MODEL = "claude-opus-4-8";
let category = "auto";
let seq = 0;
const photos = new Map(); // id -> {dataUrl, mediaType, status}

/* ---------- i18n ---------- */
const I18N = {
  en: {
    sub: "Add photos of plants, lawn or trees — get feedback on what to fix",
    keyTitle: "Anthropic API key",
    save: "Save",
    keyMissing: "Stored only in this browser (localStorage). Get a key at platform.claude.com.",
    keySaved: "✓ Key saved in this browser.",
    catAuto: "🔍 Auto-detect", catPlant: "🪴 Plant", catLawn: "🌱 Lawn", catTree: "🌳 Tree",
    dropMain: "<b>Click to add photos</b> or drag &amp; drop them here",
    dropSub: "You can add several at once",
    diagnoseAll: "Diagnose all photos", clear: "Clear",
    diagnose: "Diagnose", rediagnose: "Re-diagnose", removePhoto: "Remove photo",
    ready: "Ready — click Diagnose to get feedback.",
    analyzing: "Examining the photo — identifying species and symptoms…",
    notesPh: "Optional notes for this photo (symptoms, watering, weather…)",
    needKey: "Add your Anthropic API key at the top of the page first.",
    badKey: "Invalid API key — check the key you saved above.",
    rateLimited: "Rate limited — wait a minute and try again.",
    refused: "The AI declined to analyze this image. Try a different photo.",
    noDiagnosis: "The AI returned no diagnosis — try again.",
    network: "Network error — check your internet connection.",
    apiError: (s) => `API error (${s}).`,
    unidentified: "Unidentified",
    sections: { issues: "Problems found", now: "Do this now", care: "Ongoing care", prevent: "Prevention" },
    status: {
      healthy: "Healthy", minor_issues: "Minor issues", moderate_issues: "Needs attention",
      severe_issues: "Serious problems", dying_or_dead: "Critical condition",
    },
    water: {
      too_much_water: ["💧 Too much water — cut back", true],
      too_little_water: ["🏜️ Needs more water", true],
      watering_ok: ["💧 Watering looks OK", false],
      cannot_tell: null,
    },
    confidence: { high: "high confidence", medium: "medium confidence", low: "low confidence" },
    severity: { low: "low", medium: "medium", high: "high" },
  },
  ro: {
    sub: "Adaugă poze cu plante, gazon sau copaci — primești sfaturi despre ce e de făcut",
    keyTitle: "Cheie API Anthropic",
    save: "Salvează",
    keyMissing: "Se păstrează doar în acest browser (localStorage). Obții o cheie pe platform.claude.com.",
    keySaved: "✓ Cheie salvată în acest browser.",
    catAuto: "🔍 Detectare automată", catPlant: "🪴 Plantă", catLawn: "🌱 Gazon", catTree: "🌳 Copac",
    dropMain: "<b>Apasă pentru a adăuga poze</b> sau trage-le aici",
    dropSub: "Poți adăuga mai multe deodată",
    diagnoseAll: "Diagnostichează toate pozele", clear: "Șterge tot",
    diagnose: "Diagnostichează", rediagnose: "Re-diagnostichează", removePhoto: "Șterge poza",
    ready: "Pregătit — apasă Diagnostichează pentru feedback.",
    analyzing: "Se examinează poza — se identifică specia și simptomele…",
    notesPh: "Notițe opționale pentru această poză (simptome, udare, vreme…)",
    needKey: "Adaugă mai întâi cheia API Anthropic în partea de sus a paginii.",
    badKey: "Cheie API invalidă — verifică cheia salvată mai sus.",
    rateLimited: "Prea multe cereri — așteaptă un minut și încearcă din nou.",
    refused: "AI-ul a refuzat să analizeze această imagine. Încearcă altă poză.",
    noDiagnosis: "AI-ul nu a returnat niciun diagnostic — încearcă din nou.",
    network: "Eroare de rețea — verifică conexiunea la internet.",
    apiError: (s) => `Eroare API (${s}).`,
    unidentified: "Neidentificat",
    sections: { issues: "Probleme găsite", now: "Fă asta acum", care: "Îngrijire în continuare", prevent: "Prevenție" },
    status: {
      healthy: "Sănătos", minor_issues: "Probleme minore", moderate_issues: "Necesită atenție",
      severe_issues: "Probleme serioase", dying_or_dead: "Stare critică",
    },
    water: {
      too_much_water: ["💧 Prea multă apă — redu udarea", true],
      too_little_water: ["🏜️ Are nevoie de mai multă apă", true],
      watering_ok: ["💧 Udarea pare în regulă", false],
      cannot_tell: null,
    },
    confidence: { high: "încredere ridicată", medium: "încredere medie", low: "încredere scăzută" },
    severity: { low: "scăzut", medium: "mediu", high: "ridicat" },
  },
};

let lang = localStorage.getItem("gd_lang")
  || ((navigator.language || "").toLowerCase().startsWith("ro") ? "ro" : "en");
const t = (key) => I18N[lang][key];

function applyLang() {
  document.documentElement.lang = lang;
  localStorage.setItem("gd_lang", lang);
  document.querySelectorAll(".lang-toggle button").forEach((b) =>
    b.classList.toggle("active", b.dataset.lang === lang));
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const v = t(el.dataset.i18n);
    if (v) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    const v = t(el.dataset.i18nHtml);
    if (v) el.innerHTML = v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
    const v = t(el.dataset.i18nPh);
    if (v) el.placeholder = v;
  });
  keyStatus();
}
document.querySelector(".lang-toggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-lang]");
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  applyLang();
});

/* ---------- API key handling ---------- */
function keyStatus() {
  const has = !!localStorage.getItem("gd_api_key");
  const el = $("key-status");
  el.textContent = has ? t("keySaved") : t("keyMissing");
  el.classList.toggle("ok", has);
}
$("save-key").addEventListener("click", () => {
  const v = $("api-key").value.trim();
  if (v) localStorage.setItem("gd_api_key", v);
  $("api-key").value = "";
  keyStatus();
});
applyLang();

/* ---------- category chips ---------- */
$("chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
  chip.classList.add("active");
  category = chip.dataset.cat;
});

/* ---------- adding photos ---------- */
$("drop-zone").addEventListener("click", () => $("file-input").click());
$("file-input").addEventListener("change", (e) => {
  addFiles(e.target.files);
  e.target.value = "";
});
["dragover", "dragenter"].forEach((ev) =>
  $("drop-zone").addEventListener(ev, (e) => { e.preventDefault(); $("drop-zone").classList.add("drag"); }));
["dragleave", "drop"].forEach((ev) =>
  $("drop-zone").addEventListener(ev, (e) => { e.preventDefault(); $("drop-zone").classList.remove("drag"); }));
$("drop-zone").addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

function addFiles(fileList) {
  for (const file of fileList) {
    if (!file.type.startsWith("image/")) continue;
    const id = "p" + (++seq);
    const img = new Image();
    img.onload = () => {
      const MAX = 1568;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.88);
      photos.set(id, { dataUrl, mediaType: "image/jpeg", status: "ready" });
      renderPhotoCard(id, file.name);
      refreshToolbar();
    };
    img.onerror = () => URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(file);
  }
}

function renderPhotoCard(id, name) {
  const p = photos.get(id);
  const card = document.createElement("div");
  card.className = "card photo-card";
  card.id = id;
  card.innerHTML = `
    <div class="photo-left">
      <img src="${p.dataUrl}" alt="${esc(name)}">
      <textarea data-i18n-ph="notesPh" placeholder="${esc(t("notesPh"))}"></textarea>
      <div class="row">
        <button class="btn one" data-i18n="diagnose">${esc(t("diagnose"))}</button>
      </div>
      <button class="remove" data-i18n="removePhoto">${esc(t("removePhoto"))}</button>
    </div>
    <div class="photo-right">
      <div class="status" data-i18n="ready">${esc(t("ready"))}</div>
    </div>`;
  card.querySelector(".one").addEventListener("click", () => diagnose(id));
  card.querySelector(".remove").addEventListener("click", () => {
    photos.delete(id);
    card.remove();
    refreshToolbar();
  });
  $("photos").prepend(card);
}

function refreshToolbar() {
  $("analyze-all").disabled = photos.size === 0;
  $("clear-all").style.display = photos.size ? "inline-block" : "none";
}
$("clear-all").addEventListener("click", () => {
  photos.clear();
  $("photos").innerHTML = "";
  refreshToolbar();
});
$("analyze-all").addEventListener("click", async () => {
  for (const id of [...photos.keys()]) {
    const p = photos.get(id);
    if (p && p.status !== "analyzing" && p.status !== "done") await diagnose(id);
  }
});

/* ---------- Claude call ---------- */
const DIAGNOSIS_SCHEMA = {
  type: "object",
  properties: {
    subject_type: { type: "string", enum: ["plant", "lawn", "tree", "unknown"] },
    identification: {
      type: "object",
      properties: {
        common_name: { type: "string" },
        scientific_name: { type: "string" },
        confidence: { type: "string", enum: ["high", "medium", "low"] },
      },
      required: ["common_name", "scientific_name", "confidence"],
      additionalProperties: false,
    },
    health_status: {
      type: "string",
      enum: ["healthy", "minor_issues", "moderate_issues", "severe_issues", "dying_or_dead"],
    },
    summary: { type: "string" },
    issues: {
      type: "array",
      items: {
        type: "object",
        properties: {
          name: { type: "string" },
          category: {
            type: "string",
            enum: ["overwatering", "underwatering", "nutrient_deficiency", "disease", "pest",
                   "sunlight", "soil", "temperature_stress", "mowing_or_pruning", "other"],
          },
          severity: { type: "string", enum: ["low", "medium", "high"] },
          evidence: { type: "string" },
          nutrient: { type: ["string", "null"] },
        },
        required: ["name", "category", "severity", "evidence", "nutrient"],
        additionalProperties: false,
      },
    },
    immediate_actions: { type: "array", items: { type: "string" } },
    ongoing_care: { type: "array", items: { type: "string" } },
    watering_verdict: {
      type: "string",
      enum: ["too_much_water", "too_little_water", "watering_ok", "cannot_tell"],
    },
    prevention_tips: { type: "array", items: { type: "string" } },
    photo_quality_note: { type: ["string", "null"] },
  },
  required: ["subject_type", "identification", "health_status", "summary", "issues",
             "immediate_actions", "ongoing_care", "watering_verdict", "prevention_tips",
             "photo_quality_note"],
  additionalProperties: false,
};

const SYSTEM_PROMPT = `You are GardenDoc, an expert horticulturist, arborist, turf-grass specialist and plant pathologist helping a home gardener diagnose problems from photos.

Analyze the photo carefully:
- Identify the plant / grass / tree as precisely as the photo allows.
- Look for symptoms: leaf color patterns (interveinal chlorosis -> iron/magnesium, uniform yellowing of older leaves -> nitrogen, browning tips, purpling -> phosphorus), wilting, leaf drop, fungal spots, powdery coatings, rust, thatch, bare or yellow lawn patches, dollar spot, brown patch, grub/pest damage, scorch, root rot signs, over/underwatering signs, mower scalping, compaction, etc.
- Distinguish overwatering (yellow + limp leaves, soggy soil, fungus gnats, root rot smell) from underwatering (crispy brown edges, dry pulling-away soil, wilt that recovers after water).
- Be honest about uncertainty: if the photo can't support a firm diagnosis, lower the identification confidence, use "cannot_tell" for the watering verdict, and use photo_quality_note to ask for a better shot.
- Make actions concrete and doable by a home gardener: name the type of product (e.g. "chelated iron foliar spray", "balanced 10-10-10 fertilizer", "neem oil"), rough amounts, and frequency. Consider the user's notes if given.
- If the plant is healthy, say so plainly and keep issues empty.`;

async function diagnose(id) {
  const p = photos.get(id);
  const card = $(id);
  if (!p || !card) return;
  const right = card.querySelector(".photo-right");

  const apiKey = localStorage.getItem("gd_api_key");
  if (!apiKey) {
    right.innerHTML = `<div class="err">${esc(t("needKey"))}</div>`;
    $("key-card").scrollIntoView({ behavior: "smooth" });
    return;
  }

  const notes = card.querySelector("textarea").value.trim();
  let userText = category === "auto"
    ? "Diagnose what you see in this photo of my garden."
    : `Diagnose this ${category} from my garden.`;
  if (notes) userText += `\n\nMy notes / what I've observed: ${notes}`;
  if (lang === "ro") {
    userText += "\n\nIMPORTANT: Write every free-text field of the JSON (common_name, summary, "
      + "issue names, evidence, immediate_actions, ongoing_care, prevention_tips, "
      + "photo_quality_note) in Romanian. Keep scientific_name in Latin and keep all "
      + "enum values (subject_type, category, severity, health_status, watering_verdict, "
      + "confidence) exactly as defined in the schema.";
  }
  userText += "\n\nReturn the diagnosis in the required JSON format.";

  p.status = "analyzing";
  right.innerHTML = `<div class="status"><div class="spinner"></div>${esc(t("analyzing"))}</div>`;
  card.querySelector(".one").disabled = true;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 16000,
        thinking: { type: "adaptive" },
        system: SYSTEM_PROMPT,
        output_config: { format: { type: "json_schema", schema: DIAGNOSIS_SCHEMA } },
        messages: [{
          role: "user",
          content: [
            { type: "image",
              source: { type: "base64", media_type: p.mediaType,
                        data: p.dataUrl.split(",")[1] } },
            { type: "text", text: userText },
          ],
        }],
      }),
    });

    if (!res.ok) {
      let msg = t("apiError")(res.status);
      try {
        const body = await res.json();
        if (body?.error?.message) msg = body.error.message;
      } catch (_) { /* keep generic */ }
      if (res.status === 401) msg = t("badKey");
      if (res.status === 429) msg = t("rateLimited");
      throw new Error(msg);
    }

    const body = await res.json();
    if (body.stop_reason === "refusal") {
      throw new Error(t("refused"));
    }
    const text = (body.content || []).find((b) => b.type === "text")?.text;
    if (!text) throw new Error(t("noDiagnosis"));
    const d = JSON.parse(text);
    p.status = "done";
    right.innerHTML = renderDiagnosis(d);
  } catch (err) {
    p.status = "error";
    const msg = err instanceof TypeError ? t("network") : (err.message || "Error.");
    right.innerHTML = `<div class="err">${esc(msg)}</div>`;
  } finally {
    const btn = card.querySelector(".one");
    btn.disabled = false;
    btn.dataset.i18n = "rediagnose";
    btn.textContent = t("rediagnose");
  }
}

/* ---------- rendering ---------- */
const STATUS_EMOJI = {
  healthy: "🌿", minor_issues: "🌱", moderate_issues: "⚠️",
  severe_issues: "🚨", dying_or_dead: "💀",
};
const TYPE_EMOJI = { plant: "🪴", lawn: "🌱", tree: "🌳", unknown: "🔍" };

function renderDiagnosis(d) {
  const L = I18N[lang];
  const idc = d.identification || {};
  const conf = idc.confidence ? ` · ${esc(L.confidence[idc.confidence] || idc.confidence)}` : "";
  let html = `
    <div class="verdict">
      <div class="health-badge">${STATUS_EMOJI[d.health_status] || "🌿"}</div>
      <div>
        <h2>${TYPE_EMOJI[d.subject_type] || ""} ${esc(idc.common_name || L.unidentified)}</h2>
        <div class="sci">${esc(idc.scientific_name || "")}${conf}</div>
        <div class="status-line status-${esc(d.health_status)}">${L.status[d.health_status] || esc(d.health_status)}</div>
      </div>
    </div>
    <p class="summary">${esc(d.summary)}</p>`;

  const wf = L.water[d.watering_verdict];
  if (wf) html += `<div class="water-flag${wf[1] ? " bad" : ""}">${wf[0]}</div>`;

  if (d.issues?.length) {
    html += `<h3 class="section">${esc(L.sections.issues)}</h3>`;
    for (const i of d.issues) {
      const nutrient = i.nutrient ? ` — ${esc(i.nutrient)}` : "";
      html += `
        <div class="issue ${esc(i.severity)}">
          <b>${esc(i.name)}${nutrient}</b><span class="tag">${esc(L.severity[i.severity] || i.severity)}</span>
          <p>${esc(i.evidence)}</p>
        </div>`;
    }
  }
  if (d.immediate_actions?.length) {
    html += `<h3 class="section">${esc(L.sections.now)}</h3><ol class="actions">`;
    for (const a of d.immediate_actions) html += `<li>${esc(a)}</li>`;
    html += `</ol>`;
  }
  if (d.ongoing_care?.length) {
    html += `<h3 class="section">${esc(L.sections.care)}</h3><ul class="plain">`;
    for (const a of d.ongoing_care) html += `<li>${esc(a)}</li>`;
    html += `</ul>`;
  }
  if (d.prevention_tips?.length) {
    html += `<h3 class="section">${esc(L.sections.prevent)}</h3><ul class="plain">`;
    for (const tip of d.prevention_tips) html += `<li>${esc(tip)}</li>`;
    html += `</ul>`;
  }
  if (d.photo_quality_note) {
    html += `<div class="note">📸 ${esc(d.photo_quality_note)}</div>`;
  }
  return html;
}
</script>
</body>
</html>
